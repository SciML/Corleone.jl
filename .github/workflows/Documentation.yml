name: Documentation

on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-deploy-docs:
    name: Documentation
    uses: SciML/.github/.github/workflows/documentation.yml@v1
    with:
      julia-version: '1.10'
      cache: true
    secrets: inherit
