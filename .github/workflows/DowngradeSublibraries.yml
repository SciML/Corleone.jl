name: Downgrade Sublibraries
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  downgrade-sublibraries:
    uses: "SciML/.github/.github/workflows/sublibrary-downgrade.yml@v1"
    secrets: "inherit"
    with:
      julia-version: "lts"
      group-env-name: "CORLEONE_TEST_GROUP"
      group-env-value: "Core"
      # CorleoneGame currently requires Julia >= 1.11, so it gets its own job below.
      exclude: "CorleoneGame"
  downgrade-corleonegame:
    uses: "SciML/.github/.github/workflows/sublibrary-downgrade.yml@v1"
    secrets: "inherit"
    with:
      julia-version: "1.11"
      projects: "lib/CorleoneGame"
      group-env-name: "CORLEONE_TEST_GROUP"
      group-env-value: "Core"
